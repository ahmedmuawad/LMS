name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: الجودة والاختبارات
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: تجهيز PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, redis, gd, zip, bcmath
          coverage: none

      - name: تجهيز Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: تثبيت تبعيات PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: تثبيت تبعيات الواجهة
        run: npm ci

      - name: التهيئة
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite database/testing.sqlite

      - name: تنسيق الكود (Pint)
        run: php vendor/bin/pint --test

      - name: بناء الأصول
        run: npm run build

      - name: الهجرات
        run: php artisan migrate --force

      - name: الاختبارات (Pest)
        run: php vendor/bin/pest

      - name: تشغيل الخادم للفحوص البصرية
        run: |
          php artisan serve --host=127.0.0.1 --port=8899 &
          npx --yes wait-on http://127.0.0.1:8899/up --timeout 60000

      - name: تثبيت متصفّح الفحص
        run: npx playwright install --with-deps chromium

      - name: تجهيز مشترك تجريبي وحساب فريق للفحوص
        run: |
          php artisan demo:tenant --fresh
          php artisan demo:tenant --slug=fresh --fresh --onboarding
          php artisan demo:tenant --slug=center --mode=center --plan=center --fresh
          php artisan super-admin:create --name="فريق الفحص" --email=gate@platform.test --password=gate-password

      # رابط الحجز يحمل رمزاً عشوائياً لا رقماً متسلسلاً — نقرأه للفحص
      - name: قراءة رمز الحجز التجريبي
        run: echo "BOOKING_TOKEN=$(php artisan demo:booking-token --slug=demo)" >> "$GITHUB_ENV"

      # الشاشات المحمية تُفحص بجلسة حقيقية، وإلا فُحصت صفحة الدخول بدلاً منها
      - name: فحص الاستجابة (6 مقاسات × لغتين)
        env:
          PLAYWRIGHT_CHROMIUM: ''
        run: |
          node tests/Browser/responsive.mjs
          node tests/Browser/responsive.mjs http://127.0.0.1:8899 /super/login
          node tests/Browser/responsive.mjs http://demo.localhost:8899 /login /courses /courses/php-from-zero /cart /blog /blog/kayfa-tabda /services /services/consultation /start-here
          GATE_EMAIL=ahmed@example.test GATE_PASSWORD=password \
            node tests/Browser/responsive.mjs http://demo.localhost:8899 /admin/dashboard /admin/billing /admin/users /admin/users/create /admin/courses /admin/lessons /admin/quizzes /admin/questions /admin/enrollments /admin/certificates /admin/taxonomies /admin/courses/1/curriculum /admin/grading /admin/orders /admin/products /admin/coupons /admin/recharge-codes /admin/recharge-codes/generate /admin/refunds /admin/services /admin/services/1/edit /admin/bookings /admin/posts /admin/pages /admin/comments /admin/forms /admin/redirects /admin/media /admin/page-builder /admin/page-builder/1 $(php -r 'foreach(array_keys(require "config/settings-groups.php") as $k) echo "/admin/settings/$k ";')
          GATE_EMAIL=ahmed@example.test GATE_PASSWORD=password \
            node tests/Browser/responsive.mjs http://fresh.localhost:8899 /onboarding/mode
          GATE_EMAIL=sara@t.test GATE_PASSWORD=password \
            node tests/Browser/responsive.mjs http://demo.localhost:8899 /learn/php-from-zero /my-courses /wallet /checkout /my-bookings "/bookings/$BOOKING_TOKEN"
          GATE_EMAIL=ahmed@example.test GATE_PASSWORD=password \
            node tests/Browser/responsive.mjs http://center.localhost:8899 /admin/attendance /admin/attendance/1 /admin/schedule /admin/fees /admin/cashboxes /admin/groups /admin/center-students /admin/center-students/1 /admin/center-students/1/report /admin/branches /admin/rooms /admin/center-invoices
          GATE_EMAIL=gate@platform.test GATE_PASSWORD=gate-password GATE_LOGIN_PATH=/super/login \
            node tests/Browser/responsive.mjs http://127.0.0.1:8899 /admin /admin/tenants /admin/plans /admin/usage /admin/health /admin/audit /admin/subscriptions /admin/invoices

      - name: فحص التباين (WCAG AA · فاتح وداكن)
        env:
          PLAYWRIGHT_CHROMIUM: ''
        run: |
          node tests/Browser/contrast.mjs
          node tests/Browser/contrast.mjs http://127.0.0.1:8899 /super/login
          node tests/Browser/contrast.mjs http://demo.localhost:8899 /login /courses /courses/php-from-zero /cart /blog /blog/kayfa-tabda /services /services/consultation /start-here
          GATE_EMAIL=ahmed@example.test GATE_PASSWORD=password \
            node tests/Browser/contrast.mjs http://demo.localhost:8899 /admin/dashboard /admin/billing /admin/users /admin/users/create /admin/courses /admin/lessons /admin/quizzes /admin/questions /admin/enrollments /admin/certificates /admin/taxonomies /admin/courses/1/curriculum /admin/grading /admin/orders /admin/products /admin/coupons /admin/recharge-codes /admin/recharge-codes/generate /admin/refunds /admin/services /admin/services/1/edit /admin/bookings /admin/posts /admin/pages /admin/comments /admin/forms /admin/redirects /admin/media /admin/page-builder /admin/page-builder/1 $(php -r 'foreach(array_keys(require "config/settings-groups.php") as $k) echo "/admin/settings/$k ";')
          GATE_EMAIL=ahmed@example.test GATE_PASSWORD=password \
            node tests/Browser/contrast.mjs http://fresh.localhost:8899 /onboarding/mode
          GATE_EMAIL=sara@t.test GATE_PASSWORD=password \
            node tests/Browser/contrast.mjs http://demo.localhost:8899 /learn/php-from-zero /my-courses /wallet /checkout /my-bookings "/bookings/$BOOKING_TOKEN"
          GATE_EMAIL=ahmed@example.test GATE_PASSWORD=password \
            node tests/Browser/contrast.mjs http://center.localhost:8899 /admin/attendance /admin/attendance/1 /admin/schedule /admin/fees /admin/cashboxes /admin/groups /admin/center-students /admin/center-students/1 /admin/center-students/1/report /admin/branches /admin/rooms /admin/center-invoices
          GATE_EMAIL=gate@platform.test GATE_PASSWORD=gate-password GATE_LOGIN_PATH=/super/login \
            node tests/Browser/contrast.mjs http://127.0.0.1:8899 /admin /admin/tenants /admin/plans /admin/usage /admin/health /admin/audit /admin/subscriptions /admin/invoices

      - name: فحص السلوك والوصولية
        env:
          PLAYWRIGHT_CHROMIUM: ''
        run: node tests/Browser/behaviour.mjs

      # الباني يحرّر بنية تُرسل نصّاً واحداً — لا يكشف خللها إلا متصفّح
      - name: فحص باني الصفحات
        env:
          PLAYWRIGHT_CHROMIUM: ''
          GATE_EMAIL: ahmed@example.test
          GATE_PASSWORD: password
        run: node tests/Browser/builder.mjs http://demo.localhost:8899

      # بوابة ADR-006: ميزانية الأداء تُفرض هنا فور توفّر الصفحات العامة.
      # - name: Lighthouse CI
      #   run: npx --yes @lhci/cli autorun
